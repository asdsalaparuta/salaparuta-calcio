media:
  input: media
  output: /salaparuta-calcio/media
content:
  - name: sito
    label: Testi e immagine della home
    type: file
    path: data/site.json
    format: json
    fields:
      - name: title
        label: Titolo principale
        type: string
      - name: intro
        label: Introduzione
        type: text
      - name: hero_image
        label: Foto di copertina
        type: image
      - name: logo_image
        label: Logo della società (versione normale o speciale)
        type: image
  - name: notizie
    label: Notizie e SalaSport
    type: file
    path: data/articles.json
    format: json
    list: true
    fields:
      - name: id
        label: Identificativo (univoco)
        type: uuid
      - name: title
        label: Titolo
        type: string
      - name: date
        label: Data
        type: date
      - name: category
        label: Categoria
        type: select
        options:
          values:
            - name: societa
              label: Società
            - name: giovanili
              label: Giovanili
      - name: image
        label: Immagine
        type: image
      - name: body
        label: Testo articolo
        type: text
      - name: published
        label: Pubblicato
        type: boolean
  - name: partite
    label: Calendari e risultati (homepage)
    type: file
    path: data/matches.json
    format: json
    list: true
    fields:
      - name: id
        label: Identificativo (univoco)
        type: uuid
      - name: team
        label: Categoria
        type: select
        options:
          values: [Pulcini, Esordienti, Under 15, Under 17]
      - name: date
        label: Data partita
        type: date
      - name: home
        label: Squadra di casa
        type: string
      - name: away
        label: Squadra ospite
        type: string
      - name: homeScore
        label: Gol casa (vuoto se non disputata)
        type: string
      - name: awayScore
        label: Gol ospite (vuoto se non disputata)
        type: string
  - name: esordienti_scheda
    label: "Esordienti - Presentazione e staff"
    type: file
    path: data/esordienti.json
    format: json
    fields:
      - name: season
        label: Stagione
        type: string
      - name: title
        label: Titolo
        type: string
      - name: description
        label: Presentazione
        type: text
      - name: team_image
        label: Foto di squadra (copertina)
        type: image
      - name: coach
        label: Allenatore
        type: string
      - name: coach_image
        label: Foto allenatore
        type: image
      - name: assistant
        label: Collaboratore tecnico
        type: string
      - name: manager
        label: Dirigente accompagnatore
        type: string
  - name: esordienti_rosa
    label: "Esordienti - Rosa e statistiche"
    type: file
    path: data/esordienti-rosa.json
    format: json
    list: true
    fields:
      - name: id
        label: Identificativo
        type: uuid
      - name: name
        label: Nome giocatore da pubblicare
        type: string
      - name: number
        label: Numero maglia
        type: string
      - name: role
        label: Ruolo
        type: select
        options:
          values: [Portiere, Difensore, Centrocampista, Attaccante, Jolly]
      - name: image
        label: Foto giocatore
        type: image
      - name: appearances
        label: Presenze
        type: number
        options: {min: 0}
      - name: goals
        label: Gol
        type: number
        options: {min: 0}
      - name: assists
        label: Assist
        type: number
        options: {min: 0}
      - name: yellows
        label: Ammonizioni
        type: number
        options: {min: 0}
      - name: reds
        label: Espulsioni
        type: number
        options: {min: 0}
      - name: visible
        label: Visibile sul sito (solo con consenso)
        type: boolean
  - name: esordienti_calendario
    label: "Esordienti - Calendario e marcatori"
    type: file
    path: data/esordienti-partite.json
    format: json
    list: true
    fields:
      - name: id
        label: Identificativo
        type: uuid
      - name: round
        label: Giornata (numero)
        type: number
        options: {min: 1}
      - name: date
        label: Data (se nota)
        type: date
      - name: time
        label: Ora (es. 10:30)
        type: string
      - name: home
        label: Squadra di casa
        type: string
      - name: home_logo
        label: Logo squadra di casa
        type: image
      - name: away
        label: Squadra ospite
        type: string
      - name: away_logo
        label: Logo squadra ospite
        type: image
      - name: home_score
        label: Gol casa (lascia vuoto prima della partita)
        type: string
      - name: away_score
        label: Gol ospite (lascia vuoto prima della partita)
        type: string
      - name: venue
        label: Campo / localita
        type: string
      - name: status
        label: Stato
        type: select
        options:
          values: [Programmata, Disputata, Rinviata]
      - name: scorers
        label: Marcatori della partita
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{player} - {team}"
        fields:
          - name: player
            label: Marcatore
            type: string
          - name: team
            label: Squadra
            type: string
          - name: minute
            label: Minuto (opzionale)
            type: string
      - name: notes
        label: Note sulla partita
        type: text
  - name: esordienti_galleria
    label: "Esordienti - Galleria fotografica"
    type: file
    path: data/esordienti-galleria.json
    format: json
    list: true
    fields:
      - name: id
        label: Identificativo
        type: uuid
      - name: image
        label: Fotografia
        type: image
      - name: caption
        label: Didascalia
        type: string
      - name: date
        label: Data (facoltativa)
        type: date
      - name: visible
        label: Visibile (solo con autorizzazioni)
        type: boolean
